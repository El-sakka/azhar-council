server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # behind the hosting provider's HTTPS proxy
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # true on HTTPS deployments

app:
  admin-password: ${ADMIN_PASSWORD:}

spring:
  application:
    name: azhar-council-archive
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/azhar_archive}
    username: ${DB_USERNAME:azhar}
    password: ${DB_PASSWORD:azhar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
