# Render Blueprint: free Docker web service. The database is an external free PostgreSQL (e.g. Neon).
services:
  - type: web
    name: azhar-council-archive
    runtime: docker
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: DB_URL          # jdbc:postgresql://<host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD  # replaces the default "Admin 123"
        sync: false
      - key: COOKIE_SECURE
        value: "true"
